- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    #Update Rendering placeholder from hztl to custom
    function UpdateRenderingPlaceHolder($item)
    {
          # Only interested in items that have a layout
        if (Get-Layout $item)
        {
            Write-Host "item name: $($item.Name)"  
            Write-Host "item path: $($item.ItemPath)"
        
            # Get renderings in this item that have renderings in the placeholder we want to update 
            $renderings =  Get-Rendering -Item $item -FinalLayout:$useFinalLayout
        
            foreach ($rendering in $renderings)
            {
                
                if($rendering.Placeholder.Contains("hztl-"))
                {
                    Write-Host "rendering.Placeholder Before: $($rendering.Placeholder)" 
                    #Rename the place holder
                    $rendering.Placeholder = $rendering.Placeholder -replace "hztl-", "custom-"
                    Set-Rendering -Item $item -Instance $rendering -FinalLayout:$useFinalLayout
                    Write-Host "rendering.Placeholder After: $($rendering.Placeholder)"  
                    Write-Host "$($item.FullPath) - Rendering $($rendering.UniqueID)"
                }
            }
        }
    }
    
    #get the root item to iterate
    $rootItem = Get-Item -Path "master:/sitecore/content/HztlFoundation/BrandX/Home"
    $defaultLayout = Get-LayoutDevice "Default"
    # Toggle for whether to update Shared or Final Layout
    $useFinalLayout = $True
    # If set to true, the script will only list the renderings that need fixing, rather than fixing them.
    $reportOnly = $False
    
    Write-Host "Start"  
    
    #Update rendering placeholder for parent item
    UpdateRenderingPlaceHolder($rootItem)
    
    foreach ( $item in Get-ChildItem -Item $rootItem -Recurse )
    {
        #Update rendering placeholder for each child item
        UpdateRenderingPlaceHolder($item)
    }
    
    Write-Host "End"  
