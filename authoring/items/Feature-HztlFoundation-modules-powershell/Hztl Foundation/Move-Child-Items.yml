Path: "/sitecore/system/Modules/PowerShell/Script Library/Hztl Foundation/Move-Child-Items"
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Define the paths of the source and destination parent items
    $sourceParentPath = "/sitecore/content/HztlFoundation/BrandX/Presentation/Headless Variants"
    $destinationParentPath = "/sitecore/content/HztlFoundation/Shared/Presentation/Headless Variants"
    
    # Get the source parent item
    $sourceParent = Get-Item -Path $sourceParentPath
    
    # Get the destination parent item
    $destinationParent = Get-Item -Path $destinationParentPath
    
    # Check if both parent items exist
    if ($sourceParent -and $destinationParent) {
        Write-Host "Moving child items from '$($sourceParent.Paths.FullPath)' to '$($destinationParent.Paths.FullPath)'..."
    
        # Get all child items of the source parent
        $childItems = Get-ChildItem -Path $sourceParent.Paths.FullPath
    
        # Iterate through each child item and move it
        foreach ($childItem in $childItems) {
            try {
                Move-Item -Path $childItem.Paths.FullPath -Destination $destinationParent.Paths.FullPath
                Write-Host "Successfully moved item: $($childItem.Name)"
            } catch {
                Write-Host "Error moving item: $($childItem.Name) - $($_.Exception.Message)" -ForegroundColor Red
            }
        }
    
        Write-Host "Child item movement complete."
    } else {
        if (-not $sourceParent) {
            Write-Host "Error: Source parent item not found at '$sourceParentPath'" -ForegroundColor Red
        }
        if (-not $destinationParent) {
            Write-Host "Error: Destination parent item not found at '$destinationParentPath'" -ForegroundColor Red
        }
    }
